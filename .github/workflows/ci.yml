name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test & Coverage Gate
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore Radpa.sln

      - name: Verify formatting
        run: dotnet format Radpa.sln --verify-no-changes --no-restore

      - name: Build solution (Release, warnings as errors)
        run: dotnet build Radpa.sln -c Release --no-restore -p:CI=true

      - name: Check for vulnerable NuGet packages
        run: dotnet list Radpa.sln package --vulnerable --include-transitive

      - name: Run Domain unit tests with coverage
        run: >
          dotnet test tests/Radpa.Domain.Tests/Radpa.Domain.Tests.csproj -c Release --no-build
          -p:CollectCoverage=true -p:CoverletOutputFormat=cobertura
          -p:CoverletOutput=../../TestResults/coverage-domain.cobertura.xml
          -p:Threshold=85 -p:ThresholdType=line -p:ThresholdStat=total

      - name: Run Application unit tests with coverage
        run: >
          dotnet test tests/Radpa.Application.Tests/Radpa.Application.Tests.csproj -c Release --no-build
          -p:CollectCoverage=true -p:CoverletOutputFormat=cobertura
          -p:CoverletOutput=../../TestResults/coverage-application.cobertura.xml
          -p:Threshold=85 -p:ThresholdType=line -p:ThresholdStat=total

      - name: Run Infrastructure & Windows live tests
        run: dotnet test tests/Radpa.Infrastructure.Tests/Radpa.Infrastructure.Tests.csproj -c Release --no-build

      - name: Run Avalonia Headless UI & RTL tests
        run: dotnet test tests/Radpa.UI.Tests/Radpa.UI.Tests.csproj -c Release --no-build

      - name: Run Risk Probe C RTL test
        run: dotnet test tests/RiskProbes/ProbeC.RtlHeadless/ProbeC.RtlHeadless.csproj -c Release --no-build

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-coverage
          path: TestResults/
          if-no-files-found: warn

  publish:
    name: Publish Single-File (${{ matrix.rid }})
    needs: build-and-test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Publish Radpa.UI (${{ matrix.rid }})
        run: dotnet publish src/Radpa.UI/Radpa.UI.csproj -c Release -r ${{ matrix.rid }} -p:CI=true -o publish/${{ matrix.rid }}

      - name: Publish Radpa.NetCollector (${{ matrix.rid }})
        run: dotnet publish src/Radpa.NetCollector/Radpa.NetCollector.csproj -c Release -r ${{ matrix.rid }} -p:CI=true -o publish/${{ matrix.rid }}

      - name: Verify zero loose runtime DLLs & measure size (${{ matrix.rid }})
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "publish/${{ matrix.rid }}" -File
          $dlls = $files | Where-Object { $_.Extension -ieq '.dll' }
          if ($dlls.Count -gt 0) {
            Write-Error "Unexpected loose DLL files found: $($dlls.Name -join ', ')"
          }
          $files | Select-Object Name, @{N='SizeMB';E={[Math]::Round($_.Length / 1MB, 2)}} | Format-Table -AutoSize

      - name: Run smoke test on win-x64 single-file binary
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          ./publish/win-x64/Radpa.exe --smoke
          if ($LASTEXITCODE -ne 0) { throw "Smoke test failed with exit code $LASTEXITCODE" }

      - name: Upload published binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: radpa-${{ matrix.rid }}
          path: |
            publish/${{ matrix.rid }}/Radpa.exe
            publish/${{ matrix.rid }}/Radpa.NetCollector.exe
